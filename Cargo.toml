[package]
name = "d2mz"
version = "0.1.0"
edition = "2024"
description = "Door 2 MeriaZard — a unified CLI browser and archive over local and remote data sources"
license = "MIT"
repository = "https://github.com/youknowcast/d2mz"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "6"
futures = "0.3.34"
opendal = { version = "0.59.2", features = ["services-fs", "services-s3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3.27.0"
