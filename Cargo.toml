[package]
name = "d2mz"
version = "0.1.0"
edition = "2024"
description = "Door 2 MeriaZard — a unified CLI browser and archive over local and remote data sources"
license = "MIT"
repository = "https://github.com/youknowcast/d2mz"

[dependencies]
anyhow = "1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dirs = "6"
futures = "0.3.34"
globset = "0.4.20"
opendal = { version = "0.59.2", default-features = false, features = ["services-fs", "services-s3", "auto-register-services", "executors-tokio", "http-transport-reqwest-rustls-no-provider", "layers-concurrent-limit", "layers-logging", "layers-retry", "layers-timeout", "services-http"] }
opendal-http-transport-reqwest = { version = "0.59.2", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Enables tests/support (real RustFS process management) for integration tests.
test-support = []
